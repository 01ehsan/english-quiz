<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1226">
<title>WordQuest · ماجراجویی کلمات</title>
<style>
:root{
  --bg:#0f1226; --bg2:#1a1f3d; --card:#222850; --card2:#2b3263;
  --txt:#f4f6ff; --mut:#9aa3d6; --acc:#7c5cff; --acc2:#00d4ff;
  --ok:#2ee59d; --okd:#12a36b; --bad:#ff5470; --badd:#c2294a;
  --gold:#ffc94d; --fire:#ff8a3d;
  --edge:#151937; --track:#12163a; --accd:#4a30c9; --dis:#33396b; --spk:#ffffff14;
  --fx1:#2a2170; --fx2:#08485e; --staroff:#3b4278;
}
:root[data-theme="light"]{
  --bg:#eaf5ff; --bg2:#f7fbff; --card:#ffffff; --card2:#d9ecff; --txt:#10325c; --mut:#5b7ea8;
  --acc:#2f8bff; --acc2:#00b4ff; --gold:#f5a400; --fire:#ff7a1a;
  --edge:#b9d6f5; --track:#cfe4fb; --accd:#1a63c4; --dis:#cfe0f3; --spk:#10325c14;
  --fx1:#bfe0ff; --fx2:#d6f0ff; --staroff:#bcd3ec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  transition:background .3s;
  background:radial-gradient(1200px 600px at 80% -10%,var(--fx1) 0%,transparent 60%),
             radial-gradient(900px 500px at 0% 110%,var(--fx2) 0%,transparent 55%),var(--bg);
  color:var(--txt);
  font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;
  display:flex;justify-content:center;overflow-x:hidden;
}
#app{width:100%;max-width:480px;min-height:100%;padding:14px 14px 40px;position:relative}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.logo{font-weight:900;font-size:20px;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;border-bottom:3px solid var(--edge)}
.chip.fire{color:var(--fire)} .chip.xp{color:var(--gold)}
.snd{background:var(--card);border-radius:14px;width:36px;height:34px;font-size:16px;border-bottom:3px solid var(--edge)}

/* rank */
.hero{background:linear-gradient(135deg,var(--card),var(--card2));border-radius:22px;padding:16px;margin-bottom:14px;border-bottom:4px solid var(--edge)}
.hero-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rank{font-size:18px;font-weight:900}
.rank small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.avatar{font-size:34px;filter:drop-shadow(0 4px 8px #0006)}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .7s cubic-bezier(.2,.9,.3,1.2)}
.bar.gold>i{background:linear-gradient(90deg,#ffb347,var(--gold))}
.bar.green>i{background:linear-gradient(90deg,var(--okd),var(--ok))}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px;font-weight:700}

/* levels */
.sec-title{font-weight:900;font-size:15px;margin:18px 4px 10px;color:var(--mut)}
.lv{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;border-bottom:5px solid var(--edge);position:relative;overflow:hidden;transition:transform .15s}
.lv:active{transform:scale(.98)}
.lv.locked{opacity:.65;filter:saturate(.5)}
.lv::after{content:"";position:absolute;inset:0;background:radial-gradient(300px 120px at 100% 0,var(--glow,#7c5cff22),transparent 70%);pointer-events:none}
.lv-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lv-ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:var(--ibg,#3a3190);box-shadow:inset 0 -4px 0 #0003}
.lv-name{font-weight:900;font-size:17px}
.lv-sub{font-size:12px;color:var(--mut);margin-top:3px;font-weight:600}
.lv-pct{margin-inline-start:auto;font-weight:900;font-size:20px}
.goal{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--gold);border-radius:3px;left:80%;box-shadow:0 0 8px var(--gold)}
.btn{color:#fff;display:block;width:100%;padding:14px;border-radius:16px;font-weight:900;font-size:16px;margin-top:14px;
  background:var(--acc);box-shadow:0 5px 0 var(--accd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accd)}
.btn.green{background:var(--ok);color:#06382a;box-shadow:0 5px 0 var(--okd)}
.btn.green:active{box-shadow:0 1px 0 var(--okd)}
.btn.ghost{color:var(--txt);background:var(--card2);box-shadow:0 5px 0 var(--edge)}
.btn.ghost:active{box-shadow:0 1px 0 var(--edge)}
.btn.dis{background:var(--dis);color:var(--mut);box-shadow:0 5px 0 var(--edge)}
.stars-row{display:flex;gap:4px;font-size:15px;margin-top:8px}

/* sheet */
.overlay{position:fixed;inset:0;background:#05071acc;backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-radius:28px 28px 0 0;padding:20px 16px 28px;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet h3{text-align:center;margin-bottom:4px;font-size:18px}
.sheet p{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.mode{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;text-align:right;border-bottom:4px solid var(--edge)}
.mode:active{transform:translateY(2px)}
.mode b{display:block;font-size:15px} .mode span{font-size:12px;color:var(--mut)}
.mode .mi{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--card2);border-radius:14px}
.tag{margin-inline-start:auto;background:var(--gold);color:#4a3400;font-weight:900;font-size:11px;padding:3px 8px;border-radius:99px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

/* game */
.g-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{background:var(--card);width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:900;border-bottom:3px solid var(--edge)}
.g-top .bar{flex:1}
.hearts{font-size:18px;letter-spacing:2px;white-space:nowrap}
.hearts .lost{filter:grayscale(1) opacity(.3)}
.combo-row{display:flex;justify-content:space-between;align-items:center;height:30px;margin-bottom:8px}
.combo{font-weight:900;color:var(--fire);font-size:16px;transition:transform .2s}
.combo.pop{animation:pop .35s}
.gxp{color:var(--gold);font-weight:900;font-size:14px}
.q-card{background:linear-gradient(160deg,var(--card),var(--card2));border-radius:26px;padding:30px 16px 26px;text-align:center;border-bottom:6px solid var(--edge);position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.q-kind{font-size:12px;color:var(--mut);font-weight:700}
.q-word{font-size:40px;font-weight:900;line-height:1.3;word-break:break-word}
.q-word.en{direction:ltr;font-family:"Segoe UI",system-ui,sans-serif;letter-spacing:.5px}
.spk{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:12px;background:var(--spk);font-size:17px}
.speed{height:6px;background:var(--track);border-radius:99px;margin:12px 4px 14px;overflow:hidden}
.speed>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad));transform-origin:right;border-radius:99px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:15px 14px;font-size:18px;font-weight:800;text-align:right;border-bottom:5px solid var(--edge);transition:transform .08s,background .15s}
.opt:active{transform:translateY(3px);border-bottom-width:2px}
.opt .n{width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--mut);flex:none}
.opt.en{direction:ltr;text-align:left;font-family:"Segoe UI",system-ui,sans-serif}
.opt.en .n{order:2;margin-inline-start:auto}
.opt.ok,.opt.no{color:#fff}
.opt.ok{background:var(--okd);border-color:#0b6b46;animation:pop .35s}
.opt.ok .n{background:#ffffff33;color:#fff}
.opt.no{background:var(--badd);border-color:#7d1530;animation:shake .4s}
.opt.no .n{background:#ffffff33;color:#fff}
.opt.dim{opacity:.45}
.opts.lock .opt{pointer-events:none}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card2);padding:10px 18px;border-radius:99px;font-weight:900;font-size:14px;z-index:90;box-shadow:0 8px 24px #0007;animation:toast 1.8s forwards;white-space:nowrap}
.float{position:fixed;font-weight:900;color:var(--gold);font-size:20px;pointer-events:none;z-index:80;animation:floatup .9s forwards;text-shadow:0 2px 8px #0008}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bump{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

/* result */
.res{text-align:center;padding-top:20px}
.res h2{font-size:26px;margin:8px 0 4px}
.big-stars{font-size:56px;letter-spacing:6px;margin:8px 0}
.big-stars span{display:inline-block;animation:bump .5s backwards}
.big-stars .off{filter:grayscale(1) opacity(.25)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:18px 0}
.stat{background:var(--card);border-radius:16px;padding:12px 4px;border-bottom:4px solid var(--edge)}
.stat b{display:block;font-size:22px} .stat span{font-size:11px;color:var(--mut);font-weight:700}
.unlock{background:linear-gradient(135deg,#ffb347,#ffc94d);color:#4a3400;border-radius:18px;padding:14px;font-weight:900;margin:12px 0;animation:bump .5s}
.res .box{background:var(--card);border-radius:18px;padding:14px;text-align:right}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.foot{text-align:center;margin-top:26px}
.foot button{background:none;color:var(--mut);font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home">
    <div class="top">
      <div class="logo">WordQuest ⚔️</div>
      <div class="chips">
        <div class="chip fire">🔥 <span id="streak">۰</span></div>
        <div class="chip xp">⭐ <span id="xp">۰</span></div>
        <button class="snd" id="themeBtn" title="تم">☀️</button>
        <button class="snd" id="sndBtn" title="صدا">🔊</button>
      </div>
    </div>
    <div class="hero">
      <div class="hero-row">
        <div class="rank"><span id="rankName">تازه‌کار</span><small id="rankNext"></small></div>
        <div class="avatar" id="avatar">🥚</div>
      </div>
      <div class="bar"><i id="rankBar" style="width:0"></i></div>
      <div class="lbl"><span>هدف امروز</span><span id="goalTxt"></span></div>
      <div class="bar gold" style="margin-top:6px;height:9px"><i id="goalBar" style="width:0"></i></div>
    </div>
    <div class="sec-title">مراحل بازی</div>
    <div id="levels"></div>
    <div class="foot"><button id="resetBtn">پاک کردن پیشرفت</button></div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="g-top">
      <button class="x" id="quitBtn">✕</button>
      <div class="bar green"><i id="gBar" style="width:0"></i></div>
      <div class="hearts" id="hearts"></div>
    </div>
    <div class="combo-row">
      <div class="combo" id="combo"></div>
      <div class="gxp">+<span id="gxp">۰</span> XP</div>
    </div>
    <div class="q-card">
      <button class="spk" id="spk">🔊</button>
      <div class="q-kind" id="qKind"></div>
      <div class="q-word" id="qWord"></div>
    </div>
    <div class="speed"><i id="speed"></i></div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden"></section>
</div>

<div id="sheetHost"></div>
<canvas id="fx"></canvas>

const LEVELS = [
  {n:1, name:'سطح ۱ · ۲۰۰ کلمه پرکاربرد', ico:'🌱', ibg:'#2a7a52', glow:'#2ee59d33', words:[]},
  {n:2, name:'سطح ۲ · تا ۵۰۰ کلمه', ico:'🔥', ibg:'#a8541c', glow:'#ff8a3d33', words:[]},
  {n:3, name:'سطح ۳ · تا ۱۰۰۰ کلمه', ico:'👑', ibg:'#6b3bd1', glow:'#7c5cff44', words:[]},
];
(function(){
  let cur = 0;
  RAW.split('\n').forEach(line=>{
    line = line.trim(); if(!line) return;
    if(line[0]==='#'){ cur = +line.slice(1)-1; return; }
    const i = line.indexOf('=');
    LEVELS[cur].words.push({en:line.slice(0,i).trim(), fa:line.slice(i+1).trim()});
  });
})();

const WORD={}, W2L={};
LEVELS.forEach((L,i)=>L.words.forEach(w=>{WORD[w.en]=w;W2L[w.en]=i;}));
const PASS = 0.8, ROUND = 10, LIVES = 3, DAILY_GOAL = 30, TIME = 8000;
const RANKS = [
  {xp:0, n:'تازه‌کار', a:'🥚'}, {xp:200, n:'کنجکاو', a:'🐣'}, {xp:600, n:'زبان‌آموز', a:'🦊'},
  {xp:1500, n:'ماجراجو', a:'🐺'}, {xp:3000, n:'استاد کلمات', a:'🦅'}, {xp:6000, n:'افسانه', a:'🐉'}
];

/* ============ STATE ============ */
const KEY = 'wordquest_v1';
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s){ s.miss=s.miss||{}; s.blitzBest=s.blitzBest||0; s.theme=s.theme||'dark'; return s; } }catch(e){}
  return {xp:0, streak:0, last:'', day:{d:'', c:0}, scores:{}, unlocked:[true,false,false], stars:[0,0,0], sound:true, miss:{}, blitzBest:0, theme:'dark'};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const toFa = n => String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const $ = id => document.getElementById(id);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const yesterday = () => { const d=new Date(Date.now()-864e5); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function mastered(l){ return LEVELS[l].words.filter(w=>(S.scores[w.en]||0)>=1).length; }
function pct(l){ return mastered(l)/LEVELS[l].words.length; }
function rankOf(xp){ let i=0; RANKS.forEach((r,k)=>{ if(xp>=r.xp) i=k; }); return i; }
function checkDay(){ if(S.day.d!==today()){ S.day={d:today(), c:0}; } }

/* ============ SOUND ============ */
let AC=null;
function tone(f,d=.12,type='sine',delay=0,vol=.15){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const sfx = {
  ok:(c)=>{ const b=520+Math.min(c,10)*40; tone(b,.1,'triangle'); tone(b*1.5,.16,'triangle',.08); },
  no:()=>{ tone(170,.25,'sawtooth',0,.12); tone(120,.3,'sawtooth',.1,.1); },
  win:()=>{ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',i*.1)); },
  lose:()=>{ [392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',i*.15,.1)); },
  tap:()=>tone(700,.05,'square',0,.05)
};
function vib(p){ try{ if(S.sound && navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function speak(t){
  if(!S.sound || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
}

/* ============ FX ============ */
const cv = $('fx'), cx = cv.getContext('2d'); let parts=[], raf=0;
function resize(){ cv.width=innerWidth; cv.height=innerHeight; } resize(); addEventListener('resize',resize);
function confetti(n=140){
  const cols=['#7c5cff','#00d4ff','#2ee59d','#ffc94d','#ff5470','#ff8a3d'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,
    s:Math.random()*8+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:100+Math.random()*60});
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.r+=p.vr;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.l/60);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts = parts.filter(p=>p.l>0&&p.y<innerHeight+30);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height),0);
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }
function floatTxt(t,el){ const r=el.getBoundingClientRect(); const d=document.createElement('div'); d.className='float'; d.textContent=t;
  d.style.left=(r.left+r.width/2-20)+'px'; d.style.top=(r.top)+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),900); }

/* ============ HOME ============ */
function show(id){ ['home','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); scrollTo(0,0); }
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  $('themeBtn').textContent=S.theme==='light'?'🌙':'☀️';
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=S.theme==='light'?'#eaf5ff':'#0f1226';
}
function renderHome(){
  checkDay(); applyTheme();
  const ri=rankOf(S.xp), r=RANKS[ri], nx=RANKS[ri+1];
  $('xp').textContent=toFa(S.xp);
  $('streak').textContent=toFa(S.streak && (S.last===today()||S.last===yesterday()) ? S.streak : 0);
  $('rankName').textContent=r.n; $('avatar').textContent=r.a;
  $('rankNext').textContent = nx ? `${toFa(nx.xp-S.xp)} امتیاز تا «${nx.n}»` : 'به اوج رسیدی! 🏆';
  $('rankBar').style.width = (nx ? (S.xp-r.xp)/(nx.xp-r.xp)*100 : 100)+'%';
  $('goalTxt').textContent = `${toFa(Math.min(S.day.c,DAILY_GOAL))} / ${toFa(DAILY_GOAL)} پاسخ درست`;
  $('goalBar').style.width = Math.min(100,S.day.c/DAILY_GOAL*100)+'%';
  $('sndBtn').textContent = S.sound?'🔊':'🔇';

  $('levels').innerHTML = LEVELS.map((L,i)=>{
    const p=pct(i), m=mastered(i), lock=!S.unlocked[i];
    const stars='★★★'.split('').map((s,k)=>`<span style="color:${k<S.stars[i]?'var(--gold)':'var(--staroff)'}">★</span>`).join('');
    return `<div class="lv ${lock?'locked':''}" style="--ibg:${L.ibg};--glow:${L.glow}">
      <div class="lv-head">
        <div class="lv-ico">${lock?'🔒':L.ico}</div>
        <div><div class="lv-name">${L.name}</div>
        <div class="lv-sub">${lock?`با ۸۰٪ سطح ${toFa(i)} باز می‌شه`:`${toFa(m)} از ${toFa(L.words.length)} کلمه یاد گرفته‌ای`}</div></div>
        <div class="lv-pct">${toFa(Math.round(p*100))}٪</div>
      </div>
      <div class="bar ${p>=PASS?'green':''}"><i style="width:${p*100}%"></i><span class="goal"></span></div>
      <div class="lbl"><span>هدف: ۸۰٪ برای باز شدن مرحله بعد</span><span class="stars-row" style="margin:0">${stars}</span></div>
      <button class="btn ${lock?'dis':''}" data-lv="${i}">${lock?'قفل است':(m? 'ادامه بده 🚀':'شروع ماجراجویی ⚔️')}</button>
    </div>`;
  }).join('');
  const miss=missedList().length;
  $('levels').innerHTML += `<div class="sec-title">تمرین‌های ویژه</div>
    <div class="lv" style="--ibg:#c2294a;--glow:#ff547033"><div class="lv-head"><div class="lv-ico">🩹</div><div><div class="lv-name">مرور اشتباهات</div><div class="lv-sub">${miss?toFa(miss)+' کلمه‌ای که غلط زدی':'هنوز اشتباهی نداری ✨'}</div></div></div>
      <button class="btn ${miss?'':'dis'}" data-sp="review">${miss?'درستشون کن 🩹':'خالیه!'}</button></div>
    <div class="lv" style="--ibg:#d98a00;--glow:#ffc94d33"><div class="lv-head"><div class="lv-ico">⚡</div><div><div class="lv-name">چالش ۶۰ ثانیه‌ای</div><div class="lv-sub">تا می‌تونی جواب بده · هر غلط ۳ ثانیه جریمه</div></div><div class="lv-pct" style="font-size:16px">🏆 ${toFa(S.blitzBest)}</div></div>
      <button class="btn" data-sp="blitz">بزن بریم ⚡</button></div>`;
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sp;
    if(k==='review' && !missedList().length){ sfx.no(); toast('اشتباهی نداری! 🎉'); return; }
    sfx.tap(); openModes(k);
  });
  document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.lv;
    if(!S.unlocked[i]){ sfx.no(); vib(80); toast(`اول ۸۰٪ سطح ${toFa(i)} رو رد کن 🔒`); return; }
    sfx.tap(); openModes(i);
  });
}

function openModes(kind){
  const sub = typeof kind==='number' ? LEVELS[kind].name : kind==='review' ? 'مرور اشتباهات' : 'چالش ۶۰ ثانیه‌ای';
  $('sheetHost').innerHTML = `<div class="overlay" id="ov"><div class="sheet">
    <h3>مدل بازی رو انتخاب کن</h3><p>${sub}</p>
    <button class="mode" data-m="ef"><div class="mi">🇬🇧</div><div><b>انگلیسی ← فارسی</b><span>کلمه انگلیسی، ۴ گزینه فارسی</span></div></button>
    <button class="mode" data-m="fe"><div class="mi">🇮🇷</div><div><b>فارسی ← انگلیسی</b><span>کلمه فارسی، ۴ گزینه انگلیسی</span></div></button>
    <button class="mode" data-m="mix"><div class="mi">🎲</div><div><b>ترکیبی</b><span>هر سؤال یک جهت تصادفی</span></div><span class="tag">+۲۰٪ XP</span></button>
  </div></div>`;
  $('ov').onclick = e => { if(e.target.id==='ov') $('sheetHost').innerHTML=''; };
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ $('sheetHost').innerHTML=''; startRound(kind,b.dataset.m); });
}

/* ============ GAME ============ */
let G=null, tick=0;
const BLITZ_MS=60000;
function pickWords(l){
  const all=LEVELS[l].words, un=shuffle(all.filter(w=>(S.scores[w.en]||0)<1)), ma=shuffle(all.filter(w=>(S.scores[w.en]||0)>=1));
  let pick = un.slice(0,7); pick = pick.concat(ma.slice(0,ROUND-pick.length));
  if(pick.length<ROUND) pick = pick.concat(un.slice(7,7+ROUND-pick.length));
  return shuffle(pick);
}
const missedList = () => Object.keys(S.miss).filter(e=>WORD[e]);
function blitzItem(){
  const un=[], all=[];
  LEVELS.forEach((L,i)=>{ if(S.unlocked[i]) L.words.forEach(w=>{
    if(w.en===G.last) return; const it={w,lv:i,retry:false}; all.push(it); if((S.scores[w.en]||0)<1) un.push(it);
  }); });
  const src=(un.length && Math.random()<.5)?un:all;
  const it=src[Math.floor(Math.random()*src.length)]; G.last=it.w.en; return it;
}
function startRound(kind,mode){
  checkDay(); clearInterval(tick);
  const base={kind, mode, i:0, combo:0, maxCombo:0, ok:0, first:0, firstCorrect:0, xp:0, over:false, lives:LIVES, last:''};
  if(typeof kind==='number'){
    G={...base, l:kind, queue:pickWords(kind).map(w=>({w,lv:kind,retry:false})), before:pct(kind)};
  }else if(kind==='review'){
    G={...base, l:-1, queue:shuffle(missedList()).slice(0,ROUND).map(e=>({w:WORD[e],lv:W2L[e],retry:false}))};
  }else{
    G={...base, l:-1, queue:[], endAt:Date.now()+BLITZ_MS};
    G.queue.push(blitzItem());
  }
  $('speed').parentElement.style.display = kind==='blitz' ? 'none' : '';
  show('game'); renderHearts(); setCombo(false); renderQ();
  if(kind==='blitz'){ blitzTick(); tick=setInterval(blitzTick,100); }
}
function blitzTick(){
  if(!G || G.kind!=='blitz' || G.over){ clearInterval(tick); return; }
  const left=G.endAt-Date.now();
  $('gBar').style.width=Math.max(0,left/BLITZ_MS*100)+'%';
  $('hearts').textContent='⏱ '+toFa(Math.max(0,Math.ceil(left/1000)));
  if(left<=0) finishBlitz();
}
function renderHearts(){
  if(G.kind==='blitz') return;
  $('hearts').innerHTML = Array.from({length:LIVES},(_,k)=>`<span class="${k<G.lives?'':'lost'}">❤️</span>`).join('');
}
function setCombo(pop){
  const c=$('combo'); c.textContent = G.combo>=2 ? `🔥 ×${toFa(G.combo)} کمبو` : '';
  if(pop){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  $('gxp').textContent = toFa(G.xp);
}
function renderQ(){
  const item = G.queue[G.i]; if(!item) return finish();
  const w = item.w, pool = LEVELS[item.lv].words;
  const dir = G.mode==='mix' ? (Math.random()<.5?'ef':'fe') : G.mode;
  const ds = shuffle(pool.filter(x=>x.en!==w.en && x.fa!==w.fa)).slice(0,3);
  const opts = shuffle([w,...ds]);
  G.cur = {w, dir, opts, answered:false};
  $('qKind').textContent = dir==='ef' ? 'معنی این کلمه چیه؟' : 'معادل انگلیسی این کلمه کدومه؟';
  const q=$('qWord'); q.textContent = dir==='ef'?w.en:w.fa; q.className='q-word '+(dir==='ef'?'en':'');
  $('spk').style.visibility = dir==='ef'?'visible':'hidden';
  $('opts').className='opts';
  $('opts').innerHTML = opts.map((o,k)=>`<button class="opt ${dir==='fe'?'en':''}" data-k="${k}"><span class="n">${toFa(k+1)}</span><span>${dir==='ef'?o.fa:o.en}</span></button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(G.kind!=='blitz') $('gBar').style.width = (G.i/G.queue.length*100)+'%';
  setCombo(false);
  if(dir==='ef' && G.kind!=='blitz') speak(w.en);
  const sp=$('speed'); sp.style.transition='none'; sp.style.transform='scaleX(1)'; void sp.offsetWidth;
  sp.style.transition=`transform ${TIME}ms linear`; sp.style.transform='scaleX(0)';
  G.t0 = Date.now();
}
function answer(k){
  if(!G || G.cur.answered || G.over) return;
  const c=G.cur; c.answered=true;
  const item=G.queue[G.i], w=c.w, picked=c.opts[k], right = picked.en===w.en, blitz=G.kind==='blitz';
  const btns=[...document.querySelectorAll('.opt')];
  $('opts').classList.add('lock');
  $('speed').style.transition='none';
  if(!item.retry){
    G.first++; if(right) G.firstCorrect++;
    const sc = S.scores[w.en]||0;
    S.scores[w.en] = right ? Math.min(2,sc+1) : 0;
    if(right) delete S.miss[w.en]; else S.miss[w.en]=1;
  }
  S.day.c += right?1:0;
  if(right){
    const left = Math.max(0, 1-(Date.now()-G.t0)/TIME);
    const bonus = Math.round(left*5);
    G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.ok++;
    let gain = 10 + Math.min(G.combo,10) + bonus; if(G.mode==='mix') gain=Math.round(gain*1.2);
    G.xp += gain; S.xp += gain;
    btns[k].classList.add('ok'); btns.forEach((b,i)=>{ if(i!==k) b.classList.add('dim'); });
    sfx.ok(G.combo); vib(20); floatTxt('+'+toFa(gain), btns[k]); setCombo(true);
    if([3,5,8,12].includes(G.combo)) toast(['','','','عالیه! 🔥','','بی‌نظیر! ⚡','','','غیرقابل‌توقف! 🚀','','','','افسانه‌ای! 👑'][G.combo]);
    if(c.dir==='fe' && !blitz) speak(w.en);
    setTimeout(next, blitz?420:750);
  }else{
    G.combo=0; setCombo(false);
    btns[k].classList.add('no');
    const ri = c.opts.findIndex(o=>o.en===w.en); btns[ri].classList.add('ok');
    btns.forEach((b,i)=>{ if(i!==k && i!==ri) b.classList.add('dim'); });
    sfx.no(); vib([80,40,80]);
    if(blitz){
      G.endAt -= 3000; floatTxt('−۳ ثانیه', btns[k]); setTimeout(next, 650);
    }else{
      speak(w.en);
      G.lives--; renderHearts();
      if(!item.retry) G.queue.push({w, lv:item.lv, retry:true});
      if(G.lives<=0){ G.over=true; save(); setTimeout(()=>finish(true),1300); }
      else setTimeout(next, 1500);
    }
  }
  save();
}
function next(){
  if(!G||G.over) return;
  G.i++;
  if(G.kind==='blitz' && !G.queue[G.i]) G.queue.push(blitzItem());
  renderQ();
}
function quit(){ clearInterval(tick); G=null; renderHome(); show('home'); }

function updateStreak(){
  if(S.last!==today()){
    S.streak = (S.last===yesterday()) ? S.streak+1 : 1;
    S.last = today();
  }
}
function checkUnlocks(){
  let n=-1;
  for(let i=0;i<2;i++){ if(!S.unlocked[i+1] && pct(i)>=PASS){ S.unlocked[i+1]=true; n=i+1; } }
  return n;
}
function renderResult(c){
  $('result').innerHTML = `<div class="res">
    <div style="font-size:60px">${c.emoji}</div>
    <h2>${c.title}</h2>
    <div style="color:var(--mut);font-size:13px">${c.sub}</div>
    ${c.mid||''}
    <div class="stats">${c.stats.map(s=>`<div class="stat"><b style="${s.c?'color:'+s.c:''}">${s.v}</b><span>${s.l}</span></div>`).join('')}</div>
    ${c.unlockedNew>=0?`<div class="unlock">🔓 سطح ${toFa(c.unlockedNew+1)} باز شد! ${LEVELS[c.unlockedNew].ico}</div>`:''}
    ${c.box||''}
    ${c.again?`<button class="btn green" id="again">${c.again}</button>`:''}
    <button class="btn ghost" id="homeBtn">برگشت به نقشه</button>
  </div>`;
  show('result');
  if(c.win){ sfx.win(); confetti(c.conf||90); vib([60,40,60,40,120]); } else sfx.lose();
  if(c.unlockedNew>=0) setTimeout(()=>{ confetti(220); sfx.win(); },700);
  if(c.again) $('again').onclick=()=>{ sfx.tap(); c.onAgain(); };
  $('homeBtn').onclick=()=>{ sfx.tap(); G=null; renderHome(); show('home'); };
}
function finish(failed){
  clearInterval(tick);
  const kind=G.kind, mode=G.mode, review=kind==='review'; G.over=true;
  const accuracy=Math.round(G.firstCorrect/Math.max(1,G.first)*100);
  let stars=0;
  if(!failed){ stars = accuracy>=90?3:accuracy>=70?2:1; if(!review) S.stars[G.l]=Math.max(S.stars[G.l],stars); }
  const unlockedNew=checkUnlocks();
  if(!failed){ updateStreak(); const bonus=stars*10; G.xp+=bonus; S.xp+=bonus; }
  save();
  const stats=[{v:toFa(accuracy)+'٪',l:'دقت'},{v:'+'+toFa(G.xp),l:'امتیاز',c:'var(--gold)'},{v:toFa(G.maxCombo),l:'بیشترین کمبو',c:'var(--fire)'}];
  const bigStars = failed?'':`<div class="big-stars">${[0,1,2].map(k=>`<span class="${k<stars?'':'off'}" style="animation-delay:${k*.18}s">⭐</span>`).join('')}</div>`;
  if(review){
    const left=missedList().length;
    renderResult({emoji:failed?'💔':(left?'🩹':'✨'), title:failed?'قلب‌هات تموم شد!':(left?'آفرین، پیش رفتی!':'همه اشتباه‌ها رو درست کردی!'),
      sub:'مرور اشتباهات', mid:bigStars, stats, unlockedNew,
      box:`<div class="box" style="text-align:center;font-weight:800">${left?`هنوز ${toFa(left)} کلمه برای مرور مونده 🩹`:'لیست اشتباهاتت خالیه 🎉'}</div>`,
      again:left?(failed?'یه بار دیگه امتحان کن 🔁':'ادامه مرور 🩹'):null, win:!failed, conf:left?90:200, onAgain:()=>startRound(kind,mode)});
    return;
  }
  const l=G.l, L=LEVELS[l], after=pct(l), before=G.before, lvlPassed=after>=PASS;
  renderResult({emoji:failed?'💔':(stars===3?'🏆':'🎉'), title:failed?'قلب‌هات تموم شد!':(stars===3?'بی‌نقص بود!':'آفرین، مرحله تموم شد!'),
    sub:failed?'اشکال نداره، دفعه بعد بهتر می‌شه 💪':L.name, mid:bigStars, stats, unlockedNew,
    box:`<div class="box">
      <div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px"><span>پیشرفت سطح</span><span>${toFa(Math.round(after*100))}٪</span></div>
      <div class="bar ${lvlPassed?'green':''}"><i id="rb" style="width:${before*100}%"></i><span class="goal"></span></div>
      <div class="lbl"><span>${lvlPassed?'✅ این سطح رو رد کردی':'هنوز '+toFa(Math.max(0,Math.ceil(PASS*L.words.length)-mastered(l)))+' کلمه تا ۸۰٪'}</span><span>${toFa(S.streak)} 🔥 روز پیاپی</span></div>
    </div>`,
    again:failed?'یه بار دیگه امتحان کن 🔁':'مرحله بعدی ▶', win:!failed, conf:stars===3?200:90, onAgain:()=>startRound(kind,mode)});
  setTimeout(()=>{ const rb=$('rb'); if(rb) rb.style.width=(after*100)+'%'; },120);
}
function finishBlitz(){
  if(!G||G.over) return;
  G.over=true; clearInterval(tick);
  const mode=G.mode, correct=G.ok, accuracy=Math.round(G.firstCorrect/Math.max(1,G.first)*100);
  const record = correct>S.blitzBest && correct>0; if(record) S.blitzBest=correct;
  updateStreak();
  const bonus=correct*2; G.xp+=bonus; S.xp+=bonus;
  const unlockedNew=checkUnlocks(); save();
  renderResult({emoji:record?'🏆':'⚡', title:record?'رکورد جدید!':'زمان تموم شد!', sub:'چالش ۶۰ ثانیه‌ای',
    mid:`<div style="font-size:70px;font-weight:900;color:var(--gold);line-height:1.1;margin:10px 0 2px">${toFa(correct)}</div><div style="color:var(--mut);font-size:13px;font-weight:700">پاسخ درست در ۶۰ ثانیه</div>`,
    stats:[{v:toFa(accuracy)+'٪',l:'دقت'},{v:'+'+toFa(G.xp),l:'امتیاز',c:'var(--gold)'},{v:'🏆 '+toFa(S.blitzBest),l:'بهترین رکورد',c:'var(--fire)'}],
    unlockedNew, again:'دوباره ⚡', win:correct>0, conf:record?220:90, onAgain:()=>startRound('blitz',mode)});
}

/* ============ EVENTS ============ */
$('quitBtn').onclick=()=>{ if(confirm('از بازی خارج می‌شی؟ پیشرفت کلمات ذخیره می‌مونه.')) quit(); };
$('spk').onclick=()=>{ if(G&&G.cur) { const s=S.sound; S.sound=true; speak(G.cur.w.en); S.sound=s; } };
$('themeBtn').onclick=()=>{ S.theme=S.theme==='light'?'dark':'light'; save(); applyTheme(); sfx.tap(); };
$('sndBtn').onclick=()=>{ S.sound=!S.sound; save(); renderHome(); if(S.sound) sfx.tap(); };
$('resetBtn').onclick=()=>{ if(confirm('همه پیشرفت و امتیازها پاک بشه؟')){ localStorage.removeItem(KEY); S=load(); renderHome(); } };
addEventListener('keydown',e=>{ if(!$('game').classList.contains('hidden') && '1234'.includes(e.key) && e.key) answer(+e.key-1); });

renderHome();
</script>
